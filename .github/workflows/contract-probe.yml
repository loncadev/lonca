# On-demand read-only contract probe. Calls the main read endpoints of every
# marketplace SDK against the sandbox / stage accounts, reduces the responses
# to key-set + JSON-type shapes (never values) and compares them with the
# committed baseline in probe-snapshots/. Structural drift opens or updates a
# single issue labelled `drift`. See scripts/probe/README.md.
name: Contract probe

on:
  # Manual runs only. Decision 2026-08-30: the repo owner keeps marketplace
  # credentials out of GitHub secrets, so the nightly cron was removed —
  # drift checks run locally via `pnpm probe:check` (see scripts/probe/README.md).
  # workflow_dispatch stays functional should secrets ever be added.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: contract-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe live contracts
    # Secrets are not available on forks and the schedule must not fan out.
    if: github.repository == 'loncadev/lonca' && (secrets.HB_API_USER != '' || secrets.TY_API_KEY != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HB_MERCHANT_ID: ${{ secrets.HB_MERCHANT_ID }}
      HB_API_USER: ${{ secrets.HB_API_USER }}
      HB_API_PASS: ${{ secrets.HB_API_PASS }}
      HB_ENV: ${{ secrets.HB_ENV }}
      HB_INTEGRATOR_NAME: ${{ secrets.HB_INTEGRATOR_NAME }}
      TY_SELLER_ID: ${{ secrets.TY_SELLER_ID }}
      TY_API_KEY: ${{ secrets.TY_API_KEY }}
      TY_API_SECRET: ${{ secrets.TY_API_SECRET }}
      TY_ENV: ${{ secrets.TY_ENV }}
      TY_INTEGRATOR_NAME: ${{ secrets.TY_INTEGRATOR_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDKs
        run: pnpm build

      - name: Probe and compare with committed snapshots
        id: probe
        # Exit codes: 0 no drift, 1 drift, 2 missing credentials / internal error.
        # Captured instead of failing here so the drift issue step can run;
        # the final step re-raises the failure.
        run: |
          set +e
          pnpm probe:check --require-credentials
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "probe exit code: $code"

      - name: Upload fresh snapshots and report
        if: steps.probe.outputs.code != '0'
        uses: actions/upload-artifact@v6
        with:
          name: probe-output-${{ github.run_id }}
          path: probe-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update the drift issue
        if: steps.probe.outputs.code == '1'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Contract drift detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = 'Report file missing (see run logs).';
            try {
              report = fs.readFileSync('probe-output/report.md', 'utf8');
            } catch {}
            if (report.length > 60000) report = report.slice(0, 60000) + '\n\n… (truncated, see artifact)';
            const stamp = new Date().toISOString().slice(0, 10);
            const body = [
              `Nightly contract probe found structural drift on ${stamp}.`,
              '',
              `Run: ${runUrl}`,
              `Fresh snapshots + report are attached to the run as the \`probe-output-${context.runId}\` artifact.`,
              '',
              'To accept the new shape: run `pnpm probe` locally, review the diff in `probe-snapshots/`, and commit it.',
              '',
              report,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
              per_page: 50,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
              core.info(`Opened issue #${created.number}`);
            }

      - name: Fail the job when the probe did not pass
        if: steps.probe.outputs.code != '0'
        run: |
          echo "Contract probe exited with code ${{ steps.probe.outputs.code }} (1 = drift, 2 = credentials/internal)."
          exit 1
